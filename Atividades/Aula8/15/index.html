<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos Animados</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <h1 class="titulo">Elementos Animados</h1>
    </header>
    <main>
        <div class="container">
            <div class="card card1">
                <i class="fa-solid fa-laptop-code"></i>
                <h2>Desenvolvimento</h2>
                <p>Criação de sites modernos.</p>
            </div>
            <div class="card card2">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <h2>Aplicativos</h2>
                <p>Apps Android e iOS.</p>
            </div>
            <div class="card card3">
                <i class="fa-solid fa-cloud"></i>
                <h2>Cloud</h2>
                <p>Soluções em nuvem.</p>
            </div>
            <div class="card card4">
                <i class="fa-solid fa-shield-halved"></i>
                <h2>Segurança</h2>
                <p>Proteção de sistemas.</p>
            </div>
        </div>
        <div class="botoes">
            <button class="btn1">Cadastrar</button>
            <button class="btn2">Entrar</button>
        </div>
    </main>
</body>
</html>
