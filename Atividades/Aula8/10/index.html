<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Destinos Turísticos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Destinos Turísticos</h1>
        <p>Conheça alguns dos lugares mais incríveis do mundo.</p>
    </header>
    <section class="galeria">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900"
            alt="Praia">
            <h2>Maldivas</h2>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=900"
            alt="Paris">
            <h2>Paris</h2>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1549692520-acc6669e2f0c?w=900"
            alt="Japão">
            <h2>Kyoto</h2>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=900"
            alt="Nova York">
            <h2>Nova York</h2>
        </div>
    </section>
</body>
</html>
