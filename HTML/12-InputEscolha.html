<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input de Escolha</title>
</head>
<body>
    <h1>Input de escolha</h1>
<form action="./">
    <label for="opcao" name="opcao"><input type="radio">Opção 1</label>
    <label for="opcao" name="opcao"><input type="radio" checked>Opção 2</label>
    <label for="opcao" name="opcao"><input type="radio">Opção 3</label>
    <label for="opcao" name="opcao"><input type="radio">Opção 4</label>
</form>

    <label for="opcoes" name="opcaoes">
        <input type="checkbox" name="opcoes" id="opcao1">opcao1
    </label>
    <label for="opcoes" name="opcaoes">
        <input type="checkbox" name="opcoes" id="opcao2" checked>opcao2
    </label>
    <label for="opcoes" name="opcaoes">
        <input type="checkbox" name="opcoes" id="opcao3">opcao3
    </label>
    <label for="opcoes" name="opcaoes">
        <input type="checkbox" name="opcoes" id="opcao4">opcao4
    </label>
</body>
</html>
