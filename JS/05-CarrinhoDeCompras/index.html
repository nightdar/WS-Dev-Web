<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho de Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Yuyu&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="titulo">
        <h1>Carrinho de Compras</h1>
        <h2>itens de tecnologia</h2>
      </div>

      <button class="btn-header" onclick="abrirModal()"><span>+</span> Novo produto</button>
    </header>
    <main>
      <section class="card">
        <h2>Adicionar produto</h2>
        <label for="produto">Produto</label>
        <select name="produto" id="produto"></select>
        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" min="1" value="1" />

        <button onclick="adicionarProduto()" class="btn-adicionar">Adicionar ao carrinho</button>
        <div class="preview" id="preview">
          <!-- Todo HTML dessa parte irá aparecer via JS -->
        </div>
      </section>
      <section class="card">
        <h2>Produtos no Carrinho</h2>
        <div class="carrinho" id="carrinho">
          <!-- Todo HTML dessa parte irá aparecer via JS -->
        </div>
        <hr />
        <div class="summary">
          <div class="summary-total">
            <p>Total</p>
            <p class="total-valor" id="total-valor">R$ 0,00</p>
          </div>
          <button class="total-limpar" onclick="limparCarrinho()">Limpar</button>
        </div>
      </section>
    </main>
    <dialog id="modalProduto">
      <h2>Novo produto</h2>
       
        <label for="novoNome">Nome</label>
      <input type="text" id="novoNome" placeholder="Ex: Teclado Mecânico" />
       
        <label for="novoPreco">Preço</label>
      <input type="number" id="novoPreco" placeholder="Ex: 199.90" />
       
        <label for="novaDescricao">Descrição</label>
      <input type="text" id="novaDescricao" placeholder="Ex: RGB, USB, ABNT2" />
       
        <label for="novaImagem">URL da imagem</label>
      <input type="text" id="novaImagem" placeholder="https://exemplo.com/imagem.jpg" />
       
        <div class="modal-actions">
      <button class="btn-light" onclick="fecharModal()">Cancelar</button>
      <button onclick="salvarProduto()">Salvar</button>
      </div>
      </dialog>
    <script src="script.js"></script>
  </body>
</html>
