<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cards Interativos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <h1>Cards Interativos de Serviços</h1>
        <p>Conheça alguns dos nossos serviços.</p>
    </header>
    <section class="cards">
        <div class="card">
            <i class="fa-solid fa-laptop-code"></i>
            <h2>Desenvolvimento Web</h2>
            <p>Criação de sites modernos e responsivos.</p>
            <button>Saiba Mais</button>
        </div>
        <div class="card">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <h2>Aplicativos</h2>
            <p>Apps Android e iOS personalizados.</p>
            <button>Saiba Mais</button>
        </div>
        <div class="card">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>Segurança</h2>
            <p>Proteção para sistemas e redes.</p>
            <button>Saiba Mais</button>
        </div>
        <div class="card">
            <i class="fa-solid fa-cloud"></i>
            <h2>Cloud</h2>
            <p>Soluções em computação na nuvem.</p>
            <button>Saiba Mais</button>
        </div>
    </section>
</body>
</html>
