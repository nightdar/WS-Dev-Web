<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Position</h1>
    <div class="elemento-estatico">
        <p>static</p>
    </div>
    <div class="elemento-relativo">
        <p>relative</p>
    </div>
    <div class="elemento-absoluto">
        <p>absolute</p>
    </div>
    <div class="elemento-relativo-pai">
        <p>relative father</p>
        <div class="elemento-relativo-filho">
            <p>relative son</p>
        </div>
    </div>
</body>
</html>
