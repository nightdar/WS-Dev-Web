<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input de ação </title>
</head>
<body>
    <h1>Inputs de ação</h1>
    <label for="numero">Número: </label>
    <input type="number" id="Idade" min="2" max="10" title="Digite sua Idade" placeholder="Idade">
    <label for="senha">Senha: </label>
    <input type="password" name="senha" id="senha" minlength="10" maxlength="20" required placeholder="Senha" title="Digite uma Senha">
    <label for="confirmacao">Realizar envio do formulario</label>
    <input type="submit" id="E" value="Enviar">
    <label for="limpar">Limpar dados do formulario</label>
    <input type="reset" value="Limpar" id="L">
</body>
</html>
