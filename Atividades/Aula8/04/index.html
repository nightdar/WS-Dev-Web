<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Escola de Idiomas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1>Global Languages</h1>
    <p>Aprenda um novo idioma de maneira prática.</p>
    </header>

    <section>
        <h2>Faça sua inscrição</h2>
        <input type="text" placeholder="Digite seu nome">
        <h2>Idiomas Disponíveis</h2>
        <ul>
            <li>Inglês</li>
            <li>Espanhol</li>
            <li>Francês</li>
            <li>Alemão</li>
            <li>Italiano</li>
        </ul>
        <p class="texto">
            Aprender um novo idioma abre portas para novas oportunidades profissionais,
            viagens internacionais e crescimento pessoal.
        </p>

    </section>
</body>
</html>
