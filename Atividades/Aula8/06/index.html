<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Festival de Música</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="banner">
        <h1>Festival Music Live 2026</h1>
        <p>O maior festival de música do Brasil.</p>
    </header>
    <section class="atracoes">
        <h2>Atrações</h2>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=700" alt="Show">
            <h3>Banda Rock Nation</h3>
            <p>Show principal do festival.</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=700" alt="DJ">
            <h3>DJ Eletronic</h3>
            <p>Música eletrônica durante toda a noite.</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=700" alt="Cantora">
            <h3>Cantora Pop</h3>
            <p>Os maiores sucessos do momento.</p>
        </div>
    </section>
    <section class="video">
        <h2>Vídeo Oficial do Evento</h2>
        <iframe width="560"
        height="315"
        src="https://www.youtube.com/watch?v=qV5lzRHrGeg"
        title="Festival"
        allowfullscreen>
        </iframe>
    </section>
    <section class="ingressos">
        <h2>Compre seu ingresso</h2>
        <button>Comprar Agora</button>
    </section>
</body>
</html>
