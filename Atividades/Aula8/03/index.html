<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clube de Leitura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clube de Leitura</h1>
        <p>Faça parte da nossa comunidade de leitores.</p>
    </header>

    <main>
        <form>
            <h2>Cadastro</h2>

            <label>Nome</label>
            <input type="text" placeholder="Digite seu nome" required>

            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" required>

            <label>Código do Associado</label>
            <input type="text" value="Gerado automaticamente" disabled>

            <h3>Gênero Literário Favorito</h3>

            <label>
            <input type="radio" name="genero">
            Romance
            </label>

            <label>
            <input type="radio" name="genero">
            Fantasia
            </label>

            <label>
            <input type="radio" name="genero">
            Terror
            </label>

            <label>
            <input type="radio" name="genero">
            Ficção Científica
            </label>

            <h3>Livros Recomendados</h3>

            <ul>
                <li>Dom Casmurro</li>
                <li>O Hobbit</li>
                <li>1984</li>
                <li>Harry Potter</li>
                <li>O Pequeno Príncipe</li>
            </ul>

            <nav>

            <a href="#">Início</a>

            <a href="#">Livros</a>

            <a href="#">Eventos</a>

            <a href="#">Contato</a>

            </nav>

            <button>Cadastrar</button>

    </form>

    </main>

    </body>

    </html>
