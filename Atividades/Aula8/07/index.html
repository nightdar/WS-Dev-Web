<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vitrine de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tech Store</h1>
        <p>Os melhores produtos de tecnologia.</p>
    </header>
    <main class="produtos">
        <div class="produto">
            <span class="promocao">PROMOÇÃO</span>
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"
            alt="Celular">
            <h2>Smartphone</h2>
            <p>128GB • 8GB RAM</p>
            <h3>R$ 2.199,00</h3>
        </div>
        <div class="produto">
            <span class="promocao">NOVO</span>
            <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=600"
            alt="Notebook">
            <h2>Notebook Gamer</h2>
            <p>RTX • 16GB RAM</p>
            <h3>R$ 5.999,00</h3>
        </div>
        <div class="produto">
            <span class="promocao">15% OFF</span>
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
            alt="Fone">
            <h2>Headset</h2>
            <p>Bluetooth</p>
            <h3>R$ 299,90</h3>
        </div>
    </main>
    <a href="#" class="topo">↑</a>
</body>
</html>
